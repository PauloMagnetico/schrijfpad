name: GitHub Pages

# Publiceert de statische app (map app/) op GitHub Pages bij elke push naar
# main. Alleen oefenen werkt daar volledig; groepssessies hebben de
# WebSocket-server nodig (server/) en werken dus enkel op een eigen host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Site samenstellen (zonder testpagina's)
        run: |
          mkdir _site
          cp -r app/. _site/
          rm -f _site/test-*.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
