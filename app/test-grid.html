<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Lettergrid</title>
<style>body{font-family:sans-serif;background:#fff;margin:8px}div.cell{display:inline-block;margin:2px;border:1px solid #ddd}</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
import { LETTERS, GUIDES, BOX_H } from './js/letters.js';
const { ASC, XH, BL, DSC } = GUIDES;
const grid = document.getElementById('grid');
for (const [letter, def] of Object.entries(LETTERS)) {
  const vbW = def.w + 30;
  const starts = def.strokes.map((s, i) => {
    const m = s.d.match(/M\s*([\d.]+)\s+([\d.]+)/);
    return `<circle cx="${m[1]}" cy="${m[2]}" r="7" fill="#C25E00"/><text x="${m[1]}" y="${Number(m[2]) + 4}" text-anchor="middle" font-size="11" fill="#fff">${i + 1}</text>`;
  }).join('');
  grid.insertAdjacentHTML('beforeend', `<div class="cell"><svg width="${vbW * 0.55}" height="${BOX_H * 0.55}" viewBox="-15 0 ${vbW} ${BOX_H}">
    <line x1="-15" y1="${ASC}" x2="${vbW}" y2="${ASC}" stroke="#ddd"/>
    <line x1="-15" y1="${XH}" x2="${vbW}" y2="${XH}" stroke="#bbb"/>
    <line x1="-15" y1="${BL}" x2="${vbW}" y2="${BL}" stroke="#333"/>
    <line x1="-15" y1="${DSC}" x2="${vbW}" y2="${DSC}" stroke="#ddd"/>
    ${def.strokes.map((s) => `<path d="${s.d}" fill="none" stroke="#2357D9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
    ${starts}
  </svg></div>`);
}
document.title = 'KLAAR';
</script>
</body>
</html>
