<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Tracer-test</title></head>
<body>
<pre id="out"></pre>
<script type="module">
import { LETTERS } from './js/letters.js';
import { Tracer, bewegingen } from './js/engine.js';

const results = [];
for (const letter of Object.keys(LETTERS)) {
  // Een perfecte leerling schrijft per vloeiende beweging: pen pas van het
  // blad aan het eind van een beweging (i-punt, t-streep, volgende deelletter).
  const groups = bewegingen(letter);
  for (const params of [{ name: 'trace' }, { name: 'write', tolerance: 40, startRadius: 46 }]) {
    const tr = new Tracer(letter, params);
    const log = [];
    let ok = true;
    for (let gi = 0; gi < groups.length; gi++) {
      const pts = groups[gi].pts;
      const b = tr.beginStroke(pts[0]);
      if (b !== 'ok') { log.push(`beweging ${gi}: begin=${b}`); ok = false; break; }
      if (!tr.isDot) {
        for (const p of pts) {
          const m = tr.move(p);
          if (m !== 'ok') log.push(`beweging ${gi}: move=${m} at ${p.map((n) => n.toFixed(0))}`);
        }
      }
      const e = tr.endStroke();
      const expected = gi === groups.length - 1 ? 'done-letter' : 'done-stroke';
      if (e !== expected) { log.push(`beweging ${gi}: end=${e}, verwacht ${expected} (progress ${(tr.fractionDone() * 100).toFixed(0)}%)`); ok = false; break; }
    }
    if (!ok || log.length) results.push({ letter, mode: params.name, ok, stars: ok ? tr.stars() : 0, log });
  }
}
document.getElementById('out').textContent = JSON.stringify({ failures: results, total: Object.keys(LETTERS).length }, null, 1);
document.title = 'KLAAR';
</script>
</body>
</html>
